services:
  - type: web
    name: cuespace-backend
    runtime: python
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        value: "sqlite+aiosqlite:///./cuespace.db"
      - key: FRONTEND_URL
        value: "https://cuespace-seven.vercel.app"
      - key: BACKEND_CORS_ORIGINS
        value: "https://cuespace-seven.vercel.app,http://localhost:3000"
